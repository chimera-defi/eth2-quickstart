# Prysm Beacon Node Configuration
# Base configuration - custom settings are merged during installation
# See docs/PRYSM_FLAGS_ANALYSIS.md for flag documentation

# Core Configuration
execution-endpoint: http://$LH:$ENGINE_PORT
accept-terms-of-use: true

# Database & Backup
# Enables /db/backup HTTP endpoint on monitoring port
# Backups are stored in $DATADIR/backups/ by default
enable-db-backup-webhook: true

# P2P Networking
p2p-udp-port: 12000
p2p-tcp-port: 13000
p2p-allowlist: public

# Performance Optimizations
max-goroutines: 5000
block-batch-limit: 64
block-batch-limit-burst-factor: 2
slots-per-archive-point: 2048

# Blob Handling (Deneb+)
blob-batch-limit: 384
blob-batch-limit-burst-factor: 3
blob-save-fsync: true

# Monitoring and observability
monitoring-host: $CONSENSUS_HOST
monitoring-port: 8080
enable-tracing: false

# MEV/Builder Configuration
# Note: Builder is enabled automatically when http-mev-relay is set
http-mev-relay: http://$MEV_HOST:$MEV_PORT
local-block-value-boost: 10
# min-builder-bid is in Gwei: 2000000 Gwei = 0.002 ETH (matches MIN_BID in exports.sh)
min-builder-bid: 2000000
# Fallback to local building after consecutive missed slots
max-builder-consecutive-missed-slots: 3
max-builder-epoch-missed-slots: 8

# Security & Reliability
disable-broadcast-slashings: true
enable-discovery-reboot: true
ignore-unviable-attestations: true
