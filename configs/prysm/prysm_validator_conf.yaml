# Prysm Validator Client Configuration
# Base configuration - custom settings are merged during installation
# See docs/PRYSM_FLAGS_ANALYSIS.md for flag documentation

# Security
enable-doppelganger: true
enable-slashing-protection-history-pruning: true

# Key Management
dynamic-key-reload-debounce-interval: 1s

# MEV/Builder Registration
# Enables periodic validator registration with builder network
# Note: This is the primary flag name; "enable-validator-registration" is an alias
enable-builder: true
# Gas limit for builder-constructed blocks (default 60000000 = 60M)
# Current mainnet target is ~30M, setting slightly higher for headroom
suggested-gas-limit: 36000000

# Web UI (disabled by default for security)
web: false

# Note: REST API is experimental but will replace gRPC after v8 (2026)
# Uncomment when ready to migrate:
# enable-beacon-rest-api: true
