# Teku Beacon Node Base Configuration
# Current as of Teku 25.x — data-storage-mode: minimal (prunes historic blocks too)

# Network
network: "mainnet"
p2p-enabled: true
p2p-port: 9000
p2p-discovery-enabled: true
p2p-peer-lower-bound: 64

# Data storage: minimal prunes finalized blocks beyond MIN_EPOCHS_FOR_BLOCK_REQUESTS
# (valid values: ARCHIVE, PRUNE, MINIMAL — case-insensitive on teku 25.x).
data-storage-mode: "minimal"

# Execution layer connection
ee-endpoint: "http://$LH:$ENGINE_PORT"

# REST API
rest-api-enabled: true
rest-api-host-allowlist: ["$CONSENSUS_HOST", "localhost"]
rest-api-cors-origins: ["*"]

# Logging
log-destination: "CONSOLE"
logging: "INFO"

# Builder/MEV settings (builder-endpoint wired; registration + blinded enabled per-install when MEV active)
builder-endpoint: "http://$MEV_HOST:$MEV_PORT"

# Performance optimizations
validators-early-attestations-enabled: true

# Monitoring
metrics-enabled: true
metrics-port: 8008
metrics-interface: "$CONSENSUS_HOST"