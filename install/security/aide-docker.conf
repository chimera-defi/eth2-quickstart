# Minimal AIDE config for Docker/container environments
# The default config scans paths that may fail in containers (xattr, proc, etc.)
# This config only scans essential paths that work reliably in containers
database=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
database_new=file:/var/lib/aide/aide.db.new
gzip=9
# R = report changes (permissions, owner, group, inode, links, acl)
R = p+u+g+i+n+l+acl
/etc R
/bin R
/usr/bin R
/usr/sbin R
