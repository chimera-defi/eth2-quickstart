# AIDE minimal config - reference only (actual config is inline in consolidated_security.sh)
# Monitors /etc, /bin, /usr/bin, /usr/sbin with sha256 for content integrity
# Per AIDE best practices: https://github.com/aide/aide/blob/master/doc/aide.conf.5
database=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
database_new=file:/var/lib/aide/aide.db.new
R = p+u+g+i+n+l+sha256
/etc R
/bin R
/usr/bin R
/usr/sbin R
