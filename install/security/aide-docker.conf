# Minimal AIDE config for Docker/container environments
# The default config scans paths that may fail in containers (xattr, proc, overlay fs)
# This config only scans essential paths; excludes acl/xattrs which can fail in containers
database=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
database_new=file:/var/lib/aide/aide.db.new
gzip=9
# R = report (p=perms u=user g=group i=inode n=links l=name - no acl/xattrs for container compat)
R = p+u+g+i+n+l
/etc R
/bin R
/usr/bin R
/usr/sbin R
