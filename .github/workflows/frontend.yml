name: Frontend CI

concurrency:
  group: frontend-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      # The site serves committed copies of these (frontend/public/llms*.txt),
      # so a repo-root edit alone must still run the drift check below.
      - 'llms.txt'
      - 'llms-full.txt'
  pull_request:
    branches: [ main, master, develop, 'cursor/**' ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'llms.txt'
      - 'llms-full.txt'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"  # Pin for reproducible CI (1.2.x)

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: TypeScript type check
        run: bunx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"  # Pin for reproducible CI (1.2.x)

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test -- --coverage --passWithNoTests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"  # Pin for reproducible CI (1.2.x)

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs BEFORE the build on purpose: `bun run build` fires the `prebuild`
      # hook which regenerates these files, so checking afterwards would be
      # testing the hook rather than the committed state. The site is deployed
      # from the checkout by an out-of-repo pipeline that may never run the
      # hook, so the committed copies are what actually ship.
      - name: Verify served llms.txt files match repo root
        run: |
          bun scripts/sync-llms.mjs
          if ! git diff --exit-code -- public/llms.txt public/llms-full.txt; then
            echo "::error::frontend/public/llms.txt and/or llms-full.txt are stale."
            echo "The website serves the COMMITTED copies under frontend/public/, so they must be"
            echo "regenerated and committed whenever the repo-root llms.txt / llms-full.txt change."
            echo "Fix: run 'bun scripts/sync-llms.mjs' from frontend/ and commit the regenerated files."
            exit 1
          fi

      - name: Build Next.js application
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            frontend/.next/
            frontend/out/
          retention-days: 7

  deploy-smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: [build]
    # Only after a real merge to the live branch — a PR never publishes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      # Merging publishes to eth2quickstart.com through a pipeline that lives
      # outside this repo, so a failed publish is invisible here: the site keeps
      # serving the previous build and answering 200. That happened on
      # 2026-07-29 (a broken prebuild step stopped deploys for ~35 minutes) and
      # was only caught by hand. This job is the automatic version of that check.
      - name: Wait for the new build to go live, then check the site
        env:
          SITE: https://eth2quickstart.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Deploys normally land in ~2-3 minutes; allow well past that before
          # calling it a failure so ordinary slowness doesn't page anyone.
          deadline=$(( SECONDS + 900 ))
          live_sha=""
          until [ "$SECONDS" -ge "$deadline" ]; do
            live_sha="$(curl -fsSL --max-time 20 "$SITE/build-info.json?cb=$RANDOM" 2>/dev/null \
              | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Deployed: $live_sha"
              break
            fi
            echo "Waiting for deploy (live=${live_sha:-none} expected=$EXPECTED_SHA)"
            sleep 30
          done

          if [ "$live_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Site did not publish $EXPECTED_SHA within 15 minutes (live=${live_sha:-none}). The deploy pipeline is outside this repo — check its build logs."
            exit 1
          fi

          # The 2026-07-29 outage showed up as new routes 404ing while the old
          # build kept serving, so assert the routes exist, not just the origin.
          fail=0
          for path in / /quickstart /blog /agents /llms.txt /sitemap.xml /robots.txt \
                      /blog/ethereum-client-bakeoff /blog/bakeoff-results \
                      /blog/bakeoff-harness /blog/how-we-tested-with-claude \
                      /deck/bakeoff.html; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$path?cb=$RANDOM")"
            if [ "$code" = "200" ]; then
              echo "  ok   $code $path"
            else
              echo "::error::$path returned $code"
              fail=1
            fi
          done
          exit "$fail"
