name: Frontend CI

concurrency:
  group: frontend-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      # The site serves committed copies of these (frontend/public/llms*.txt),
      # so a repo-root edit alone must still run the drift check below.
      - 'llms.txt'
      - 'llms-full.txt'
  pull_request:
    branches: [ main, master, develop, 'cursor/**' ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'llms.txt'
      - 'llms-full.txt'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"  # Pin for reproducible CI (1.2.x)

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: TypeScript type check
        run: bunx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"  # Pin for reproducible CI (1.2.x)

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test -- --coverage --passWithNoTests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"  # Pin for reproducible CI (1.2.x)

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs BEFORE the build on purpose: `bun run build` fires the `prebuild`
      # hook which regenerates these files, so checking afterwards would be
      # testing the hook rather than the committed state. The site is deployed
      # from the checkout by an out-of-repo pipeline that may never run the
      # hook, so the committed copies are what actually ship.
      - name: Verify served llms.txt files match repo root
        run: |
          bun scripts/sync-llms.mjs
          if ! git diff --exit-code -- public/llms.txt public/llms-full.txt; then
            echo "::error::frontend/public/llms.txt and/or llms-full.txt are stale."
            echo "The website serves the COMMITTED copies under frontend/public/, so they must be"
            echo "regenerated and committed whenever the repo-root llms.txt / llms-full.txt change."
            echo "Fix: run 'bun scripts/sync-llms.mjs' from frontend/ and commit the regenerated files."
            exit 1
          fi

      - name: Build Next.js application
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            frontend/.next/
            frontend/out/
          retention-days: 7
