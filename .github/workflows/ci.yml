name: CI - Docker Integration Tests

permissions:
  contents: read
  packages: write  # For pushing test image to GHCR (image reuse across jobs)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**/*.sh'
      - 'test/Dockerfile'
      - 'test/docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop, 'cursor/**' ]
    paths:
      - '**/*.sh'
      - 'test/Dockerfile'
      - 'test/docker-compose.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:  # Allow manual trigger for testing

# Path filters: run ONLY when shell files or test infra change. Skip on doc-only, config-only, frontend-only.
# - **/*.sh: all shell scripts (install, lib, test, docs, root)
# - test/Dockerfile, test/docker-compose.yml: Docker build (not .sh)
# - workflow_dispatch: always runs (manual trigger)
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Fail-fast: jobs run in dependency chain. When one fails, subsequent jobs are skipped.
# Order: shellcheck -> build-docker -> docker-integration -> run-* -> e2e-client-matrix.
# build-docker pushes to GHCR when not a fork; other jobs pull instead of building.
# Job-level timeouts prevent runaway jobs (e.g. 10hr hangs).
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run shellcheck
      run: |
        sudo apt-get update && sudo apt-get install -y shellcheck

        echo "Running shellcheck on all shell scripts..."
        find . -name "*.sh" -type f ! -path "./.git/*" | while read -r script; do
          echo "Checking $script..."
          if ! shellcheck -x --exclude=SC2317,SC1091,SC1090,SC2034,SC2031,SC2181 "$script"; then
            echo "❌ Shellcheck failed for $script"
            exit 1
          fi
        done
        echo "✅ All scripts passed shellcheck!"

    - name: Check shebangs
      run: |
        echo "Checking for shell scripts without shebang..."
        failed=0
        while IFS= read -r script; do
          if ! head -1 "$script" | grep -q "^#!/"; then
            echo "❌ $script lacks shebang (first line must be #!/bin/bash or similar)"
            failed=1
          fi
        done < <(find . -name "*.sh" -type f ! -path "./.git/*")
        if [[ $failed -eq 1 ]]; then exit 1; fi
        echo "✅ All scripts have shebangs"

    - name: Check executable permissions
      run: |
        echo "Checking executable permissions..."
        while IFS= read -r script; do
          if [[ ! -x "$script" ]]; then
            echo "⚠️  $script is not executable (chmod +x for directly-invoked scripts; sourced libs may omit)"
          fi
        done < <(find . -name "*.sh" -type f ! -path "./.git/*")
        echo "✅ Executable check completed (warnings only; sourced libs like lib/common_functions.sh may omit +x)"

    - name: Validate script dependencies
      run: |
        echo "Validating script dependencies (sourced files must exist)..."
        failed=0
        while IFS= read -r script; do
          script_dir=$(dirname "$script")
          while IFS= read -r line; do
            # Extract source path from: source "path" or source path
            source_file=$(echo "$line" | sed -n 's/.*source[[:space:]]*["\x27]*\([^"'\''[:space:]]*\)["\x27]*.*/\1/p')
            [[ -z "$source_file" ]] && continue
            # Skip variable paths, ~/ paths, /dev/null
            [[ "$source_file" == \$* ]] && continue
            [[ "$source_file" == *\$* ]] && continue
            [[ "$source_file" == ~/* ]] && continue
            [[ "$source_file" == /dev/null ]] && continue
            [[ "$source_file" == *cargo/env* ]] && continue
            # Resolve: ./ or ../ from script dir; else from project root (many scripts assume cwd=project root)
            if [[ "$source_file" == ./* ]] || [[ "$source_file" == ../* ]]; then
              resolved=$(cd "$script_dir" && realpath "$source_file" 2>/dev/null || echo "")
            else
              resolved="$source_file"
            fi
            if [[ -n "$resolved" ]] && [[ ! -f "$resolved" ]]; then
              echo "❌ $script sources missing file: $source_file (resolved: $resolved)"
              failed=1
            fi
          done < <(grep -n '^[[:space:]]*source[[:space:]]' "$script" 2>/dev/null || true)
        done < <(find . -name "*.sh" -type f ! -path "./.git/*")
        if [[ $failed -eq 1 ]]; then exit 1; fi
        echo "✅ All script dependencies exist"

    - name: Check run_1.sh and run_2.sh structure
      run: |
        echo "Checking run_1.sh and run_2.sh structure..."
        for script in run_1.sh run_2.sh; do
          [[ ! -f "$script" ]] && continue
          if ! head -20 "$script" | grep -q "set -Eeuo pipefail"; then
            echo "⚠️  $script does not use 'set -Eeuo pipefail' (recommended for strict error handling)"
          fi
          if ! grep -q "source.*exports.sh" "$script"; then
            echo "❌ $script must source exports.sh"
            exit 1
          fi
          echo "✅ $script structure check done"
        done

  # Build once, push to GHCR. Other jobs pull instead of building (saves ~5 builds).
  # Fork PRs: push fails (no package write), jobs fall back to building.
  build-docker:
    needs: [shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: test/Dockerfile
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('ghcr.io/{0}/eth-node-test:{1}', github.repository, github.sha) || 'eth-node-test' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: meta
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "image=ghcr.io/${{ github.repository }}/eth-node-test:${{ github.sha }}" >> $GITHUB_OUTPUT

  docker-integration:
    needs: [build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.build-docker.outputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        if: needs.build-docker.outputs.image != ''
        run: |
          docker pull ${{ needs.build-docker.outputs.image }}
          docker tag ${{ needs.build-docker.outputs.image }} eth-node-test
      - name: Build image (fallback for fork PRs)
        uses: docker/build-push-action@v6
        if: needs.build-docker.outputs.image == ''
        with:
          context: .
          file: test/Dockerfile
          load: true
          tags: eth-node-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Lint and unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Lint"
          docker run --rm -e SKIP_SHELLCHECK=true eth-node-test /workspace/test/run_tests.sh --lint-only
          echo "::endgroup::"
          echo "::group::Common functions unit tests"
          docker run --rm -e USE_MOCKS=true eth-node-test bash /workspace/install/test/test_common_functions.sh
          echo "::endgroup::"
          echo "::group::Unit tests (Caddy validate, downloads, functions)"
          docker run --rm --privileged -e USE_MOCKS=false -e CI=true -e SKIP_SHELLCHECK=true -e GITHUB_TOKEN="$GITHUB_TOKEN" eth-node-test /workspace/test/docker_test.sh
          echo "::endgroup::"

  run-1-structure:
    needs: [docker-integration, build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.build-docker.outputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        if: needs.build-docker.outputs.image != ''
        run: |
          docker pull ${{ needs.build-docker.outputs.image }}
          docker tag ${{ needs.build-docker.outputs.image }} eth-node-test
      - name: Build image (fallback for fork PRs)
        if: needs.build-docker.outputs.image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/Dockerfile
          load: true
          tags: eth-node-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run run_1 structure
        run: |
          docker run --rm --privileged --user root \
            -e DEBIAN_FRONTEND=noninteractive -e DEBIAN_PRIORITY=critical -e CI=true \
            eth-node-test /workspace/test/ci_test_run_1.sh

  run-1-e2e:
    needs: [docker-integration, build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.build-docker.outputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        if: needs.build-docker.outputs.image != ''
        run: |
          docker pull ${{ needs.build-docker.outputs.image }}
          docker tag ${{ needs.build-docker.outputs.image }} eth-node-test
      - name: Build image (fallback for fork PRs)
        if: needs.build-docker.outputs.image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/Dockerfile
          load: true
          tags: eth-node-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run run_1 E2E
        env:
          CI: true
        run: SKIP_BUILD=true ./test/run_e2e.sh --phase=1

  run-2-structure:
    needs: [docker-integration, build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.build-docker.outputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        if: needs.build-docker.outputs.image != ''
        run: |
          docker pull ${{ needs.build-docker.outputs.image }}
          docker tag ${{ needs.build-docker.outputs.image }} eth-node-test
      - name: Build image (fallback for fork PRs)
        if: needs.build-docker.outputs.image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/Dockerfile
          load: true
          tags: eth-node-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run run_2 structure
        run: |
          docker run --rm --privileged --user testuser \
            -e DEBIAN_FRONTEND=noninteractive -e DEBIAN_PRIORITY=critical -e CI=true \
            eth-node-test /workspace/test/ci_test_run_2.sh

  run-2-e2e:
    needs: [docker-integration, build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.build-docker.outputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        if: needs.build-docker.outputs.image != ''
        run: |
          docker pull ${{ needs.build-docker.outputs.image }}
          docker tag ${{ needs.build-docker.outputs.image }} eth-node-test
      - name: Build image (fallback for fork PRs)
        if: needs.build-docker.outputs.image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/Dockerfile
          load: true
          tags: eth-node-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run run_2 E2E (default clients)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: SKIP_BUILD=true GITHUB_TOKEN="$GITHUB_TOKEN" ./test/run_e2e.sh --phase=2

  # Test all execution + consensus clients (PRs: 2 combos for speed, push: full 7)
  e2e-client-matrix-pr:
    if: github.event_name == 'pull_request'
    needs: [run-1-structure, run-1-e2e, run-2-structure, run-2-e2e, build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        include:
          - exec: geth
            cons: prysm
            mev: mev-boost
          - exec: besu
            cons: lighthouse
            mev: commit-boost
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.build-docker.outputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        if: needs.build-docker.outputs.image != ''
        run: |
          docker pull ${{ needs.build-docker.outputs.image }}
          docker tag ${{ needs.build-docker.outputs.image }} eth-node-test
      - name: Build image (fallback for fork PRs)
        if: needs.build-docker.outputs.image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/Dockerfile
          load: true
          tags: eth-node-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "E2E ${{ matrix.exec }}+${{ matrix.cons }}+${{ matrix.mev }}"
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: |
          SKIP_BUILD=true GITHUB_TOKEN="$GITHUB_TOKEN" \
          E2E_EXECUTION=${{ matrix.exec }} E2E_CONSENSUS=${{ matrix.cons }} E2E_MEV=${{ matrix.mev }} \
          ./test/run_e2e.sh --phase=2

  e2e-client-matrix-full:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [run-1-structure, run-1-e2e, run-2-structure, run-2-e2e, build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        include:
          - exec: geth
            cons: prysm
            mev: mev-boost
          - exec: besu
            cons: lighthouse
            mev: commit-boost
          - exec: erigon
            cons: teku
            mev: none
          - exec: nethermind
            cons: nimbus
            mev: mev-boost
          - exec: nimbus_eth1
            cons: grandine
            mev: none
          - exec: reth
            cons: lodestar
            mev: mev-boost
          - exec: ethrex
            cons: prysm
            mev: mev-boost
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.build-docker.outputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        if: needs.build-docker.outputs.image != ''
        run: |
          docker pull ${{ needs.build-docker.outputs.image }}
          docker tag ${{ needs.build-docker.outputs.image }} eth-node-test
      - name: Build image (fallback for fork PRs)
        if: needs.build-docker.outputs.image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/Dockerfile
          load: true
          tags: eth-node-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "E2E ${{ matrix.exec }}+${{ matrix.cons }}+${{ matrix.mev }}"
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: |
          SKIP_BUILD=true GITHUB_TOKEN="$GITHUB_TOKEN" \
          E2E_EXECUTION=${{ matrix.exec }} E2E_CONSENSUS=${{ matrix.cons }} E2E_MEV=${{ matrix.mev }} \
          ./test/run_e2e.sh --phase=2
