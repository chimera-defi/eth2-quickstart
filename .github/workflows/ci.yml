name: CI - Docker Integration Tests

permissions:
  contents: read
  packages: write  # For pushing test image to GHCR (image reuse across jobs)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**/*.sh'
      - '**/*.py'
      - 'skills/**'
      - 'mcp_server/**'
      - 'README.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'test/Dockerfile'
      - 'test/docker-compose.yml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [ main, master, develop, 'cursor/**' ]
    paths:
      - '**/*.sh'
      - '**/*.py'
      - 'skills/**'
      - 'mcp_server/**'
      - 'README.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'test/Dockerfile'
      - 'test/docker-compose.yml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:  # Allow manual trigger for testing

# Path filters run CI only for shell/test-infra changes; docs/frontend-only changes are skipped.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # Build once, push to GHCR. Other jobs pull instead of building (saves ~5 builds).
  # Fork PRs: push fails (no package write), jobs fall back to building.
  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: test/Dockerfile
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('ghcr.io/{0}/eth-node-test:{1}', github.repository, github.sha) || 'eth-node-test' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: meta
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "image=ghcr.io/${{ github.repository }}/eth-node-test:${{ github.sha }}" >> $GITHUB_OUTPUT

  docker-integration:
    needs: [build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-prep
        with:
          image: ${{ needs.build-docker.outputs.image }}
      - name: Lint and unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Lint"
          docker run --rm -e SKIP_SHELLCHECK=true eth-node-test /workspace/test/run_tests.sh --lint-only
          echo "::endgroup::"
          echo "::group::Common functions unit tests"
          docker run --rm -e USE_MOCKS=true eth-node-test bash /workspace/install/test/test_common_functions.sh
          echo "::endgroup::"
          echo "::group::Stats read-only tests"
          docker run --rm -e USE_MOCKS=true eth-node-test bash /workspace/install/test/test_stats_read_only.sh
          echo "::endgroup::"
          echo "::group::Host cleanup tests"
          docker run --rm -e USE_MOCKS=true eth-node-test bash /workspace/install/test/test_host_cleanup.sh
          echo "::endgroup::"
          echo "::group::Doctor service drift tests"
          docker run --rm -e USE_MOCKS=true eth-node-test bash /workspace/install/test/test_doctor_service_drift.sh
          echo "::endgroup::"
          echo "::group::Ensure dispatch tests"
          docker run --rm -e USE_MOCKS=true eth-node-test bash /workspace/install/test/test_ensure_dispatch.sh
          echo "::endgroup::"
          echo "::group::Plan JSON tests"
          docker run --rm -e USE_MOCKS=true eth-node-test bash /workspace/install/test/test_plan_json.sh
          echo "::endgroup::"
          echo "::group::Install planner unit tests"
          docker run --rm -e USE_MOCKS=true eth-node-test bash /workspace/install/test/test_install_planner.sh
          echo "::endgroup::"
          echo "::group::MCP unit tests"
          docker run --rm -e USE_MOCKS=true eth-node-test bash /workspace/test/ci_test_mcp_server.sh
          echo "::endgroup::"
          echo "::group::Unit tests (Caddy validate, downloads, functions)"
          docker run --rm --privileged -e USE_MOCKS=false -e CI=true -e SKIP_SHELLCHECK=true -e GITHUB_TOKEN="$GITHUB_TOKEN" eth-node-test /workspace/test/docker_test.sh
          echo "::endgroup::"

  run-1-structure:
    needs: [build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-prep
        with:
          image: ${{ needs.build-docker.outputs.image }}
      - name: Run run_1 structure
        run: |
          docker run --rm --privileged --user root \
            -e DEBIAN_FRONTEND=noninteractive -e DEBIAN_PRIORITY=critical -e CI=true \
            eth-node-test /workspace/test/ci_test_run_1.sh

  tui-whiptail-pipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install TUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect whiptail
      - name: Verify whiptail works when stdin is piped (curl|bash scenario)
        run: REQUIRE_WHIPTAIL_PIPE_TEST=1 ./test/whiptail_pipe_test.sh

  docs-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify active docs consistency
        run: bash ./test/ci_test_docs_consistency.sh

  agent-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify skill structure
        run: bash ./test/ci_test_skill_structure.sh
      - name: Verify skill command mapping
        run: bash ./test/ci_test_skill_command_mapping.sh
      - name: Verify skill safety
        run: bash ./test/ci_test_skill_safety.sh
      - name: Verify skill distribution contract
        run: bash ./test/ci_test_skill_distribution.sh
      - name: Verify skill installation e2e
        run: bash ./test/ci_test_skill_install_e2e.sh
      - name: Verify MCP server contract
        run: bash ./test/ci_test_mcp_server.sh

  tui-whiptail-nonskip-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install TUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect whiptail
      - name: Enforce non-skip TUI result in shared shell-test context
        env:
          REQUIRE_WHIPTAIL_PIPE_TEST: "1"
          SKIP_SHELLCHECK: "true"
          USE_MOCKS: "true"
        run: ./test/run_tests.sh --unit

  run-1-e2e:
    needs: [build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-prep
        with:
          image: ${{ needs.build-docker.outputs.image }}
      - name: Run run_1 E2E
        env:
          CI: true
        run: SKIP_BUILD=true ./test/run_e2e.sh --phase=1

  run-2-structure:
    needs: [build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-prep
        with:
          image: ${{ needs.build-docker.outputs.image }}
      - name: Run run_2 structure
        run: |
          docker run --rm --privileged --user testuser \
            -e DEBIAN_FRONTEND=noninteractive -e DEBIAN_PRIORITY=critical -e CI=true \
            eth-node-test /workspace/test/ci_test_run_2.sh

  run-2-e2e:
    needs: [build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-prep
        with:
          image: ${{ needs.build-docker.outputs.image }}
      - name: Run run_2 E2E (default clients)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: |
          # Pass E2E_EXECUTION/E2E_CONSENSUS to skip Caddy/Nginx (saves ~1.5 min)
          # Caddy/Nginx install tested in run-2-web
          SKIP_BUILD=true GITHUB_TOKEN="$GITHUB_TOKEN" \
          E2E_EXECUTION=geth E2E_CONSENSUS=prysm E2E_MEV=mev-boost \
          ./test/run_e2e.sh --phase=2

  run-2-web:
    needs: [build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-prep
        with:
          image: ${{ needs.build-docker.outputs.image }}
      - name: Run run_2 E2E (Caddy + Nginx install)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: |
          # No E2E_EXECUTION/E2E_CONSENSUS = runs Caddy+Nginx install (geth+prysm defaults)
          # Verifies install_caddy.sh, install_nginx.sh, config validity, no regressions
          SKIP_BUILD=true GITHUB_TOKEN="$GITHUB_TOKEN" ./test/run_e2e.sh --phase=2

  install-sh-smoke:
    needs: [build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-prep
        with:
          image: ${{ needs.build-docker.outputs.image }}
      - name: Run install.sh non-interactive smoke harness
        run: |
          docker run --rm --privileged --user root \
            -e DEBIAN_FRONTEND=noninteractive -e DEBIAN_PRIORITY=critical -e CI=true \
            eth-node-test /workspace/test/install_sh_smoke.sh

  # Matrix: 6 client combos (geth+prysm+mev-boost covered by run-2-e2e)
  # Execution: besu, erigon, nethermind, nimbus_eth1, reth, ethrex
  # Consensus: lighthouse, teku, nimbus, grandine, lodestar, prysm
  e2e-client-matrix:
    needs: [docker-integration, run-1-structure, tui-whiptail-pipe, tui-whiptail-nonskip-guard, docs-consistency, run-1-e2e, run-2-structure, run-2-e2e, run-2-web, install-sh-smoke, build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - exec: besu
            cons: lighthouse
            mev: commit-boost
          - exec: erigon
            cons: teku
            mev: none
          - exec: nethermind
            cons: nimbus
            mev: mev-boost
          - exec: nimbus_eth1
            cons: grandine
            mev: none
          - exec: reth
            cons: lodestar
            mev: mev-boost
          - exec: ethrex
            cons: prysm
            mev: mev-boost
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-prep
        with:
          image: ${{ needs.build-docker.outputs.image }}
      - name: "E2E ${{ matrix.exec }}+${{ matrix.cons }}+${{ matrix.mev }}"
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: |
          e2e_cmd() {
            SKIP_BUILD=true GITHUB_TOKEN="$GITHUB_TOKEN" \
            E2E_EXECUTION=${{ matrix.exec }} E2E_CONSENSUS=${{ matrix.cons }} E2E_MEV=${{ matrix.mev }} \
            ./test/run_e2e.sh --phase=2
          }

          rc=0
          for attempt in 1 2; do
            echo "Matrix E2E attempt ${attempt}/2"
            if e2e_cmd; then
              rc=0
              break
            fi
            rc=$?
            if [[ $attempt -lt 2 ]]; then
              echo "Matrix E2E failed (attempt ${attempt}/2); retrying in 15s..."
              sleep 15
            fi
          done

          exit $rc
